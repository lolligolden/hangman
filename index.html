<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel = "stylesheet" href="styles.css">
</head>
<body>
    <h1>Hangman</h1>
    <div>Level 1</div>

        <span id="L"> L </span><span id="M"> M </span></div>
    <div><span id="N"> N </span><span id="O"> O </span><span id="P"> P </span><span id="Q"> Q </span><span id="R"> R </span><span id="S"> S </span><span id="T"> T </span><span id="U"> U </span><span id="V"> V </span><span id="W"> W </span>
            <span id="X"> X </span><span id="Y"> Y </span><span id="Z"> Z </span></div></div>
    <div id="winner"></div>
    <div></div>
    <button id="btnlvl1">Level 1</button><span>    </span><button id="btnlvl2">Level 2</button><span>  </span><button id="btnlvl3">Level 3</button>
