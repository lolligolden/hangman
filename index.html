<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel = "stylesheet" href="styles.css">
</head>
<body>
    <h1>Hangman</h1>
    <img src="./images/hangmaninit.jpg" alt="A picture of the hangman pole" height="300" width="450" id="Hangman">
    <div id="winner"></div>
    <div id="playLevel">Level 1 - 5 letter words</div>
    <br></br>
    <h2 id="level"><span id="L1"></span><span id="L2"></span><span id="L3"></span><span id="L4"></span><span id="L5"></span></h2>
     <br></br>   
    <div><span id="numberTries"># of Tries: 6 </span></span></div>
    <br></br>
    <div id="guessAgain"></div>
    <div id="lettersRow1"><span id="A"> A </span><span id="B"> B </span><span id="C"> C </span><span id="D"> D </span><span id="E"> E </span><span id="F"> F </span><span id="G"> G </span><span id="H"> H </span><span id="I"> I </span><span id="J"> J </span><span id="K"> K </span>
        <span id="L"> L </span><span id="M"> M </span></div>
    <div id="lettersRow2"><span id="N"> N </span><span id="O"> O </span><span id="P"> P </span><span id="Q"> Q </span><span id="R"> R </span><span id="S"> S </span><span id="T"> T </span><span id="U"> U </span><span id="V"> V </span><span id="W"> W </span>
            <span id="X"> X </span><span id="Y"> Y </span><span id="Z"> Z </span></div>
    <br></br>
    <div id="nextLevel"></div>
    <div></div>
    <button id="play">Play Hangman</button><span>    </span><button id="reset">Reset</button><span id="resetSpan">  </span>
    <script src="script.js"></script>
</body>
</html>
